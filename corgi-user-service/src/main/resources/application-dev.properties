spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://rm-uf6us220dn444506z90210.mysql.rds.aliyuncs.com:3306/corgi?characterEncoding=utf8mb4
spring.datasource.username=product
spring.datasource.password=Corgi2020
#初始化连接
spring.datasource.initial-size=100
#最大空闲连接
spring.datasource.max-idle=200
#最小空闲连接
spring.datasource.min-idle=5
#最大连接数量
spring.datasource.max-active=500
#是否在自动回收超时连接的时候打印连接的超时错误
spring.datasource.log-abandoned=true
#是否自动回收超时连接
spring.datasource.remove-abandoned=true
#超时时间(以秒数为单位)
spring.datasource.remove-abandoned-timeout=180
##<!-- 超时等待时间以毫秒为单位 60000毫秒/1000等于60秒 -->
spring.datasource.max-wait=60000
spring.datasource.test-while-idle=true
#检测数据库的查询语句
spring.datasource.validation-query=select 1 from dual
#每隔五分钟检测空闲超过10分钟的连接
spring.datasource.min-evictable-idle-time-millis=600000
spring.datasource.time-between-eviction-runs-millis=300000
mybatis.mapper-locations=classpath:/mapping/**/*.xml


server.port = 8887
server.tomcat.max-threads = 1000
logging.config = classpath:log4j2-spring.xml

spring.application.name=corgiUser
spring.dubbo.server=true
spring.dubbo.registry=zookeeper://127.0.0.1:2181
spring.redis.host=localhost
spring.redis.port=6379

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
#spring.rabbitmq.username=test
#spring.rabbitmq.password=test
# 开启ACK
spring.rabbitmq.listener.direct.acknowledge-mode=manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual

